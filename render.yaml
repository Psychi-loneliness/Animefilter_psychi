# Render FREE plan — no disk (free services cannot attach one).
# The library lives in /tmp and is auto-restored from your Telegram backup.
services:
  - type: web
    name: anime-filter-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m animebot
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BRAND
        value: Anime Galaxy
      - key: AUTO_MENU
        value: "true"
      - key: DB_PATH
        value: /tmp/animebot.db
      - key: AUTO_RESTORE_FILE_ID
        sync: false
